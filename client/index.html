    <!--
      RedTrack (uniclick) goes here, with THIS offer's ids. DetoxMe's tag was
      deliberately not carried over: reusing its script_id or defaultcampaignid

      Place it in the head, before the app bundle, and neither async nor
      deferred: it has to read the click identifiers and set its cookie before
      paint, and decorate outbound links before any can be clicked.

      <link rel="preconnect" href="https://go.YOURDOMAIN.com" crossorigin />
      <script src="https://go.YOURDOMAIN.com/uniclick.js?attribution=lastpaid&cookiedomain=YOURDOMAIN.com&cookieduration=90&defaultcampaignid=TODO&regviewonce=false&script_id=TODO"></script>

      The cookiedomain must match the domain this page is served from, or the
      browser rejects the cookie write and only link decoration survives.

      The cmpid and sub1-sub8 string is not part of this repo. It belongs on the
      ad's destination URL in Meta Ads Manager, where Meta substitutes the
      {{ad.id}} style tokens at click time.
    -->
