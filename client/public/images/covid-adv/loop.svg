<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 560" font-family="Host Grotesk, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A8503C"/>
    </marker>
  </defs>
  <rect width="660" height="560" rx="18" fill="#FAF7F0"/>
  <circle cx="330" cy="280" r="165" fill="none" stroke="#EADBD3" stroke-width="22"/>
  <g fill="none" stroke="#A8503C" stroke-width="4.5" stroke-linecap="round" marker-end="url(#ah)">
    <path d="M410,135 A165,165 0 0 1 482,212"/>
    <path d="M482,348 A165,165 0 0 1 410,425"/>
    <path d="M250,425 A165,165 0 0 1 178,348"/>
    <path d="M178,212 A165,165 0 0 1 250,135"/>
  </g>

  <g font-size="21" text-anchor="middle">
    <rect x="190" y="70" width="280" height="76" rx="38" fill="#FFFFFF" stroke="#D8D3C6" stroke-width="1.5"/>
    <text x="330" y="102" font-weight="700" fill="#A8503C">COX-2 scissors</text>
    <text x="330" y="128" fill="#1F2530">snip the cushion</text>

    <rect x="404" y="242" width="236" height="76" rx="38" fill="#FFFFFF" stroke="#D8D3C6" stroke-width="1.5"/>
    <text x="522" y="274" font-weight="700" fill="#1F2530">Less cushion</text>
    <text x="522" y="300" fill="#6F7680">bone nearer bone</text>

    <rect x="190" y="414" width="280" height="76" rx="38" fill="#FFFFFF" stroke="#D8D3C6" stroke-width="1.5"/>
    <text x="330" y="446" font-weight="700" fill="#1F2530">Joint gets irritated</text>
    <text x="330" y="472" fill="#6F7680">reads as new damage</text>

    <rect x="20" y="242" width="236" height="76" rx="38" fill="#FFFFFF" stroke="#D8D3C6" stroke-width="1.5"/>
    <text x="138" y="274" font-weight="700" fill="#1F2530">Body sends out</text>
    <text x="138" y="300" font-weight="700" fill="#1F2530">more scissors</text>
  </g>

  <text x="330" y="262" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="2" fill="#A8503C">THE LOOP</text>
  <text x="330" y="292" text-anchor="middle" font-size="19" fill="#414954">why it rarely</text>
  <text x="330" y="316" text-anchor="middle" font-size="19" fill="#414954">clears up alone</text>
</svg>
