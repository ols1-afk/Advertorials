<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 480" font-family="Host Grotesk, Helvetica Neue, Arial, sans-serif">
  <defs>
    <symbol id="sc" viewBox="0 0 44 40">
      <polygon points="11,14 40,25 37,28.5 13,18.5" fill="#9AA3AE" stroke="#4B5563" stroke-width="1.2" stroke-linejoin="round"/>
      <polygon points="11,26 40,15 37,11.5 13,21.5" fill="#B8C0C9" stroke="#4B5563" stroke-width="1.2" stroke-linejoin="round"/>
      <circle cx="7.5" cy="11" r="5.2" fill="none" stroke="#A8503C" stroke-width="3"/>
      <circle cx="7.5" cy="29" r="5.2" fill="none" stroke="#A8503C" stroke-width="3"/>
      <circle cx="22" cy="20" r="1.8" fill="#4B5563"/>
    </symbol>
  </defs>
  <rect width="660" height="480" rx="18" fill="#FAF7F0"/>
  <line x1="330" y1="36" x2="330" y2="448" stroke="#E7E3D9" stroke-width="2"/>

  <text x="165" y="54" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="1.8" fill="#6F7680">IBUPROFEN · ALEVE</text>
  <text x="165" y="86" text-anchor="middle" font-size="24" font-weight="700" fill="#1F2530">Sweep up scraps</text>
  <rect x="44" y="118" width="242" height="24" rx="12" fill="#CFE2E8" stroke="#9FB9C2" stroke-width="1.5"/>
  <g stroke="#B5463A" stroke-width="3" stroke-linecap="round"><path d="M86,131 l5,11"/><path d="M150,131 l-5,11"/><path d="M226,131 l6,11"/></g>
  <use href="#sc" x="96" y="142" width="62" height="56" transform="rotate(-18 127 170)"/>
  <use href="#sc" x="186" y="148" width="54" height="49" transform="rotate(14 213 172)"/>
  <!-- broom low on the floor, sweeping scraps to the left -->
  <line x1="58" y1="300" x2="290" y2="300" stroke="#E7E3D9" stroke-width="2"/>
  <g fill="#CFE2E8" stroke="#9FB9C2">
    <rect x="66" y="286" width="12" height="7" rx="2" transform="rotate(20 72 289)"/>
    <rect x="88" y="290" width="11" height="6" rx="2" transform="rotate(-30 93 293)"/>
    <rect x="108" y="288" width="9" height="6" rx="2"/>
  </g>
  <line x1="262" y1="214" x2="166" y2="282" stroke="#8F6A3E" stroke-width="8" stroke-linecap="round"/>
  <path d="M132,270 L178,276 L182,300 L124,300 Z" fill="#D9A441" stroke="#A9782A" stroke-width="2" stroke-linejoin="round"/>
  <g stroke="#A9782A" stroke-width="1.5"><line x1="136" y1="292" x2="134" y2="300"/><line x1="150" y1="292" x2="149" y2="300"/><line x1="164" y1="292" x2="164" y2="300"/></g>
  <g text-anchor="middle" font-size="20" fill="#1F2530">
    <text x="165" y="364">Quiet for a few hours.</text>
    <text x="165" y="390">Then it wears off, and</text>
    <text x="165" y="416" font-weight="700" fill="#B5463A">the scissors keep cutting.</text>
  </g>

  <text x="495" y="54" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="1.8" fill="#A8503C">AGED GINGER</text>
  <text x="495" y="86" text-anchor="middle" font-size="24" font-weight="700" fill="#1F2530">Fewer scissors out</text>
  <rect x="374" y="118" width="242" height="24" rx="12" fill="#CFE2E8" stroke="#9FB9C2" stroke-width="1.5"/>
  <rect x="410" y="174" width="170" height="126" rx="12" fill="#E9DCC4" stroke="#C9B48E" stroke-width="2"/>
  <rect x="424" y="190" width="142" height="44" rx="7" fill="#F4EBD9" stroke="#C9B48E" stroke-width="1.5"/>
  <rect x="475" y="207" width="40" height="9" rx="4.5" fill="#8F4230"/>
  <rect x="424" y="244" width="142" height="44" rx="7" fill="#F4EBD9" stroke="#C9B48E" stroke-width="1.5"/>
  <rect x="475" y="261" width="40" height="9" rx="4.5" fill="#8F4230"/>
  <circle cx="586" cy="168" r="20" fill="#E7F2EA" stroke="#5E9B72" stroke-width="2"/>
  <path d="M577,168 l6,6 l11,-12" fill="none" stroke="#3F7F55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g text-anchor="middle" font-size="20" fill="#1F2530">
    <text x="495" y="364">Shogaol turns down how</text>
    <text x="495" y="390">many come out, so there's</text>
    <text x="495" y="416" font-weight="700" fill="#3F7F55">less cutting and swelling.</text>
  </g>
</svg>
