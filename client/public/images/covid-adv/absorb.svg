  <rect width="660" height="470" rx="18" fill="#FAF7F0"/>
  <text x="30" y="48" font-size="17" font-weight="700" letter-spacing="1.8" fill="#A8503C">WHY SHOGAOL NEEDS A FAT</text>
  <text x="30" y="78" font-size="19" fill="#6F7680">Shogaol is an oil. Your stomach is mostly water.</text>
  <line x1="330" y1="100" x2="330" y2="446" stroke="#E7E3D9" stroke-width="2"/>

  <path d="M95,116 L235,116 L222,326 C221,338 212,346 200,346 L130,346 C118,346 109,338 108,326 Z" fill="#FFFFFF" stroke="#9AA0A8" stroke-width="2.5"/>
