  <g fill="#D9B56A" stroke="#A9823A" stroke-width="1.5">
    <circle cx="140" cy="172" r="10"/><circle cx="154" cy="167" r="8"/><circle cx="129" cy="166" r="7"/>
    <circle cx="190" cy="170" r="9"/><circle cx="202" cy="165" r="7"/>
    <circle cx="160" cy="332" r="9"/><circle cx="174" cy="334" r="7"/><circle cx="146" cy="335" r="6"/>
  </g>
  <text x="165" y="390" text-anchor="middle" font-size="22" font-weight="700" fill="#1F2530">Dry powder</text>
  <text x="165" y="418" text-anchor="middle" font-size="18" fill="#6F7680">clumps and passes</text>
  <text x="165" y="442" text-anchor="middle" font-size="18" fill="#6F7680">straight through</text>

  <path d="M425,116 L565,116 L552,326 C551,338 542,346 530,346 L460,346 C448,346 439,338 438,326 Z" fill="#FFFFFF" stroke="#9AA0A8" stroke-width="2.5"/>
