  <g transform="rotate(-28 495 246)">
    <rect x="458" y="227" width="74" height="38" rx="19" fill="url(#gel)" stroke="#9A5E16" stroke-width="1.5"/>
    <ellipse cx="478" cy="237" rx="10" ry="4.5" fill="#FFFFFF" opacity=".55"/>
  </g>
  <g fill="#E9A63A" opacity=".85">
    <circle cx="455" cy="206" r="4.5"/><circle cx="470" cy="290" r="4"/><circle cx="532" cy="202" r="5"/><circle cx="540" cy="282" r="4"/>
    <circle cx="510" cy="312" r="3.5"/><circle cx="452" cy="252" r="3.5"/><circle cx="548" cy="240" r="3.5"/><circle cx="486" cy="186" r="3.5"/>
