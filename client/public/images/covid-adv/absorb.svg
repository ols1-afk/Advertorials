    </linearGradient>
    <linearGradient id="gel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4C35A"/><stop offset=".55" stop-color="#E09A2E"/><stop offset="1" stop-color="#B8701C"/>
